<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập & Đăng ký - Badminton Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card p-4 shadow" style="width: 100%; max-width: 420px;">
        
        <!-- ================= FORM ĐĂNG NHẬP ================= -->
        <div id="login-box">
            <h3 class="text-center mb-3">Đăng Nhập</h3>
            
            <!-- Thông báo lỗi/thành công -->
            <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
            <div id="login-success" class="alert alert-success d-none" role="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="usernameInput">Tên đăng nhập</label>
                    <input type="text" class="form-control" id="usernameInput" placeholder="Nhập tài khoản" required>
                </div>
                <div class="form-group">
                    <label for="passwordInput">Mật khẩu</label>
                    <input type="password" class="form-control" id="passwordInput" placeholder="Nhập mật khẩu" required>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Ghi nhớ đăng nhập</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
            </form>

            <div class="text-center mt-3">
                <span>Chưa có tài khoản? </span>
                <a href="#" id="show-register" class="font-weight-bold">Đăng ký ngay</a>
            </div>
        </div>

        <!-- ================= FORM ĐĂNG KÝ ================= -->
        <div id="register-box" class="d-none">
            <h3 class="text-center mb-3">Tạo Tài Khoản</h3>
            
            <!-- Thông báo lỗi khi đăng ký -->
            <div id="register-error" class="alert alert-danger d-none" role="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="regUsername">Tên đăng nhập mới</label>
                    <input type="text" class="form-control" id="regUsername" placeholder="Nhập tên đăng nhập" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Mật khẩu</label>
                    <input type="password" class="form-control" id="regPassword" placeholder="Nhập mật khẩu" required>
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Nhập lại mật khẩu</label>
                    <input type="password" class="form-control" id="regConfirmPassword" placeholder="Nhập lại mật khẩu" required>
                </div>
                
                <button type="submit" class="btn btn-success btn-block">Đăng ký</button>
            </form>

            <div class="text-center mt-3">
                <span>Đã có tài khoản? </span>
                <a href="#" id="show-login" class="font-weight-bold">Đăng nhập</a>
            </div>
        </div>

    </div>

    <script>
        // Mặc định tạo tài khoản cứng Hungbi2605 nếu chưa từng có dữ liệu
        if (!localStorage.getItem("accounts")) {
            const initialAccounts = [
                { username: "Hungbi2605", password: "Hungbi2605@hehe" }
            ];
            localStorage.setItem("accounts", JSON.stringify(initialAccounts));
        }

        // Lấy danh sách tài khoản từ localStorage
        function getAccounts() {
            return JSON.parse(localStorage.getItem("accounts")) || [];
        }

        // Chuyển đổi qua lại giữa Đăng nhập và Đăng ký
        document.getElementById('show-register').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('login-box').classList.add('d-none');
            document.getElementById('register-box').classList.remove('d-none');
        });

        document.getElementById('show-login').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('register-box').classList.add('d-none');
            document.getElementById('login-box').classList.remove('d-none');
        });

        // ================= XỬ LÝ ĐĂNG KÝ =================
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const errorMsg = document.getElementById('register-error');

            errorMsg.classList.add('d-none');

            // 1. Kiểm tra mật khẩu nhập lại
            if (password !== confirmPassword) {
                errorMsg.innerText = "Mật khẩu nhập lại không khớp!";
                errorMsg.classList.remove('d-none');
                return;
            }

            const accounts = getAccounts();

            // 2. Kiểm tra tên tài khoản đã tồn tại chưa
            const isExist = accounts.some(acc => acc.username.toLowerCase() === username.toLowerCase());
            if (isExist) {
                errorMsg.innerText = "Tên đăng nhập này đã tồn tại!";
                errorMsg.classList.remove('d-none');
                return;
            }

            // 3. Lưu tài khoản mới vào localStorage
            accounts.push({ username: username, password: password });
            localStorage.setItem("accounts", JSON.stringify(accounts));

            // Reset form đăng ký
            document.getElementById('registerForm').reset();

            // Chuyển về màn hình đăng nhập và báo thành công
            document.getElementById('register-box').classList.add('d-none');
            document.getElementById('login-box').classList.remove('d-none');
            
            const loginSuccess = document.getElementById('login-success');
            loginSuccess.innerText = "Đăng ký thành công! Hãy đăng nhập bằng tài khoản mới.";
            loginSuccess.classList.remove('d-none');
        });

        // ================= XỬ LÝ ĐĂNG NHẬP =================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('login-error');
            const successMsg = document.getElementById('login-success');

            errorMsg.classList.add('d-none');
            successMsg.classList.add('d-none');

            const accounts = getAccounts();

            // Kiểm tra xem tên đăng nhập và mật khẩu có khớp trong danh sách không
            const userFound = accounts.find(acc => acc.username === username && acc.password === password);

            if (userFound) {
                // Đúng thì chuyển sang trang index.html
                window.location.href = "index.html";
            } else {
                // Sai thì báo lỗi
                errorMsg.innerText = "Tên đăng nhập hoặc mật khẩu không đúng!";
                errorMsg.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
